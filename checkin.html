<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benson & Precious — Wedding Check-In</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body{margin:0;background:#2c0a15;color:#fbf4ea;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:#fff;color:#2b2119;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 16px 40px #0005}.brand{text-align:center;color:#d9a679}.hidden{display:none!important}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;margin:7px 0;font-size:16px}input{border:1px solid #ccc}button{border:0;background:#55162a;color:white;font-weight:700}.result{text-align:center;padding:24px;border-radius:18px}.green{background:#e8f7ec}.yellow{background:#fff5d9}.red{background:#fde8e8}.badge{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:52px;background:white}.green .badge{color:#16803b}.yellow .badge{color:#a56a00}.red .badge{color:#b42318}.big{font-size:28px;font-weight:800;margin:8px 0}.small{color:#666}.stats{text-align:center;font-weight:700;color:#55162a}#reader{width:100%}.manual{margin-top:16px}.logout{background:#777}.danger{color:#b42318}.ok{color:#16803b}
</style></head><body><div class="wrap"><div class="brand"><h1>B &amp; P</h1><p>Wedding Check-In</p></div>
<div id="login" class="card"><h2>Usher / Admin Login</h2><p>Authorized staff only.</p><input id="user" autocomplete="username" placeholder="Username"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><div class="card"><div class="stats" id="stats">Checked in: — / — expected</div><button id="start">Start Camera Scanner</button><div id="reader" class="hidden"></div><div class="manual"><input id="manualId" placeholder="BP-XXXXXX"><button id="manualBtn">Check In Guest ID</button></div><button id="logout" class="logout">Log out</button></div><div id="result" class="card hidden"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzuSfCOFqIAVA5tVGPUptanZoDTzYz4PFIksclLh7KyITbZpRNP-oBHk6r9eaMeWDBJ/exec'; // Google Apps Script Web App URL
let token=localStorage.getItem('bp_checkin_token')||'', scanner=null;
const $=id=>document.getElementById(id);
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); refreshStats(); }
if(token) showApp();
$('loginBtn').onclick=async()=>{try{const r=await post({action:'login',username:$('user').value,password:$('pass').value});if(r.status==='success'){token=r.token;localStorage.setItem('bp_checkin_token',token);showApp();}else $('loginMsg').textContent=r.message;}catch(e){$('loginMsg').textContent='Could not connect to the check-in server.';}};
$('logout').onclick=()=>{token='';localStorage.removeItem('bp_checkin_token');location.reload();};
async function post(body){if(!API_URL) throw new Error('API_URL not configured');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json();}
async function check(id){id=(id||'').trim().toUpperCase();if(!id)return;try{const r=await post({action:'checkin',guestId:id,token});if(r.status==='error'&&/Unauthorized/i.test(r.message||'')){localStorage.removeItem('bp_checkin_token');location.reload();return;}render(r);}catch(e){render({status:'not_found',message:'Connection error — check your internet connection.'});}}
function render(r){const el=$('result');el.className='card';let cls='red',icon='✕',title='No matching guest',detail=r.message||'Guest ID not found.';if(r.status==='checked_in'){cls='green';icon='✓';title=r.name;detail='Attending · '+r.partySize+' guest'+(r.partySize===1?'':'s')+(r.dietary?' · '+r.dietary:'');}else if(r.status==='already_checked_in'){cls='yellow';icon='✓';title=r.name;detail='Already checked in at '+new Date(r.checkedAt).toLocaleTimeString();}else if(r.status==='not_attending'){cls='red';icon='✕';title=r.name||'Guest';detail='This guest RSVP was recorded as not attending.';}el.innerHTML='<div class="result '+cls+'"><div class="badge">'+icon+'</div><div class="big">'+title+'</div><div>'+detail+'</div><div class="small">'+(r.guestId||'')+'</div></div>';refreshStats();}
$('manualBtn').onclick=()=>check($('manualId').value);$('manualId').addEventListener('keydown',e=>{if(e.key==='Enter')check($('manualId').value)});
$('start').onclick=async()=>{if(!API_URL){alert('Set API_URL in checkin.html first.');return;}$('reader').classList.remove('hidden');if(scanner)return;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},text=>{scanner.pause(true);check(text);setTimeout(()=>{try{scanner.resume();}catch(e){}},1600);},()=>{});}catch(e){alert('Camera could not start. Use the manual guest ID field instead.');}};
async function refreshStats(){if(!token)return;try{const r=await fetch(API_URL+'?action=stats&token='+encodeURIComponent(token));const j=await r.json();if(j.status==='success')$('stats').textContent='Checked in: '+j.checkedIn+' / '+j.expected+' expected';}catch(e){}}
setInterval(refreshStats,15000);
</script></body></html>
