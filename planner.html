<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Planner — Benson & Precious</title>
<meta name="theme-color" content="#2c0a15">

<script>
"use strict";

const API_URL =
"https://script.google.com/macros/s/AKfycbzsvci6J14JeS7Rw1WNTI3W94R7Dp-zteZZst1YA5yLeFBrXJc53lzKgPPKQ1rlaWwg/exec";

const CREDENTIALS = {
  EventsC01: { password: "Bernadette", role: "planner", label: "Usher C01" },
  EventsC02: { password: "Memory", role: "planner", label: "Usher C02" },
  Admin: { password: "Admin", role: "planner", label: "Administrator" }
};

const SESSION_KEY = "bp_planner_session";
const WEDDING_DATE = "2026-10-10T13:00:00+03:00";
const FINAL_RULE_DATE = "2026-10-03T23:59:59+03:00";

const SECTION_ORDER = ["4 Weeks To Go", "3 Weeks To Go", "2 Weeks To Go", "1 Week To Go", "2-3 Days / Eve", "Wedding Day"];
</script>

<style>
:root {
  --burgundy-950: #2c0a15;
  --burgundy-900: #3b0f1d;
  --burgundy-800: #5c1229;
  --rose: #d7a3b3;
  --gold: #c9a24b;
  --gold-light: #e2c778;
  --cream: #fdf9f6;
  --ink: #220812;
  --green: #238636;
  --green-bg: #e9f7ec;
  --yellow: #9a6700;
  --yellow-bg: #fff8dc;
  --red: #c62828;
  --red-bg: #ffeded;
  --border: #e4d9dd;
  --shadow: 0 12px 40px rgba(0,0,0,.18);
}
* { box-sizing: border-box; }
html { width: 100%; max-width: 100%; overflow-x: hidden; }
body {
  margin: 0; width: 100%; max-width: 100%; min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--burgundy-950); color: var(--cream); overflow-x: hidden;
}
button, input { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

#loginScreen {
  width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)) 18px;
  background: radial-gradient(circle at top, rgba(201,162,75,.13), transparent 40%), var(--burgundy-950);
}
.login-card { width: 100%; max-width: 420px; background: var(--cream); color: var(--ink); border-radius: 18px; padding: 30px 24px; box-shadow: var(--shadow); }
.monogram { width: 64px; height: 64px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold); border-radius: 50%; color: var(--burgundy-800); font-family: Georgia, serif; font-size: 22px; }
.login-card h1 { margin: 0; text-align: center; color: var(--burgundy-900); font-family: Georgia, serif; font-size: 26px; }
.login-subtitle { margin: 8px 0 25px; text-align: center; color: #75656a; font-size: 14px; }
.field { margin-bottom: 16px; }
.field label { display: block; margin-bottom: 7px; color: var(--burgundy-800); font-size: 13px; font-weight: 700; }
.field input { width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--ink); outline: none; }
.primary-btn { width: 100%; min-height: 52px; border: 0; border-radius: 10px; background: var(--burgundy-800); color: #fff; font-weight: 800; }
.login-error { display: none; margin-top: 12px; padding: 11px; border-radius: 8px; background: var(--red-bg); color: var(--red); text-align: center; font-size: 13px; }

.app { width: 100%; min-height: 100vh; padding: 20px 16px max(30px, env(safe-area-inset-bottom)) 16px; }
.app-header { width: 100%; max-width: 900px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(20px, 4vw, 28px); }
.brand p { margin: 5px 0 0; color: var(--rose); font-size: 13px; }
.small-btn { min-height: 42px; padding: 9px 13px; border-radius: 9px; border: 1px solid rgba(201,162,75,.65); background: transparent; color: var(--gold-light); font-weight: 700; }

.countdown-banner { width: 100%; max-width: 900px; margin: 0 auto 16px; background: var(--cream); color: var(--ink); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; }
.countdown-item { text-align: center; flex: 1; min-width: 130px; }
.countdown-item .n { font-family: Georgia, serif; font-size: 28px; font-weight: 800; color: var(--burgundy-800); }
.countdown-item .l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #75656a; margin-top: 2px; }
.countdown-item.overdue .n { color: var(--red); }

.overall-progress { width: 100%; max-width: 900px; margin: 0 auto 20px; background: var(--cream); color: var(--ink); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
.overall-progress h3 { margin: 0 0 10px; font-family: Georgia, serif; color: var(--burgundy-800); font-size: 16px; }
.progress-track { width: 100%; height: 14px; border-radius: 7px; background: #f0e5e8; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--burgundy-800)); transition: width .4s ease; }
.progress-label { margin-top: 6px; font-size: 12px; color: #75656a; text-align: right; }

.container { width: 100%; max-width: 900px; margin: 0 auto; }
.section-card { background: var(--cream); color: var(--ink); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.section-card.current { border: 2px solid var(--gold); }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.section-header h2 { margin: 0; font-family: Georgia, serif; color: var(--burgundy-800); font-size: 18px; }
.section-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: 99px; background: var(--gold); color: var(--burgundy-950); }
.section-progress { font-size: 12px; color: #75656a; }
.section-bar { width: 100%; height: 8px; border-radius: 4px; background: #f0e5e8; overflow: hidden; margin-bottom: 14px; }
.section-bar-fill { height: 100%; background: var(--burgundy-800); transition: width .4s ease; }

.task-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0e5e8; }
.task-row:last-child { border-bottom: 0; }
.task-check { width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; accent-color: var(--burgundy-800); cursor: pointer; }
.task-body { flex: 1; min-width: 0; }
.task-text { font-size: 14px; line-height: 1.5; }
.task-text.done { text-decoration: line-through; color: #9a8b8f; }
.tba-fields { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.tba-fields input { flex: 1; min-width: 140px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.tba-badge { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--yellow-bg); color: var(--yellow); margin-left: 6px; }
.tba-badge.overdue { background: var(--red-bg); color: var(--red); }

#toast {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); width: min(90vw, 420px); padding: 12px 16px; border-radius: 10px;
  background: #171013; color: #fff; text-align: center; font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: .25s ease; z-index: 9999;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 600px) {
  .countdown-banner { flex-direction: column; }
  .app-header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="monogram">B &amp; P</div>
    <h1>Wedding Planner</h1>
    <p class="login-subtitle">Benson &amp; Precious · 10 October 2026</p>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" autocomplete="username" placeholder="Enter username">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password">
    </div>
    <button id="loginBtn" class="primary-btn" type="button">Sign In</button>
    <div id="loginError" class="login-error" role="alert">Incorrect username or password.</div>
  </div>
</section>

<section id="plannerScreen" class="app hidden">
  <header class="app-header">
    <div class="brand">
      <h1>Wedding Countdown Checklist</h1>
      <p>Signed in as <strong id="plannerWho">User</strong></p>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="plannerRefresh" class="small-btn" type="button">Refresh</button>
      <button id="plannerLogout" class="small-btn" type="button">Log Out</button>
    </div>
  </header>

  <div class="countdown-banner">
    <div class="countdown-item">
      <div class="n" id="daysToWedding">–</div>
      <div class="l">Days to Wedding</div>
    </div>
    <div class="countdown-item" id="finalRuleItem">
      <div class="n" id="daysToFinalRule">–</div>
      <div class="l">Days to "Everything Confirmed" Deadline (Oct 3)</div>
    </div>
  </div>

  <div class="overall-progress">
    <h3>Overall Progress</h3>
    <div class="progress-track"><div class="progress-fill" id="overallFill" style="width:0%"></div></div>
    <div class="progress-label" id="overallLabel">0 of 0 tasks complete</div>
  </div>

  <div class="container" id="sectionsContainer"></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
}

function apiUrl(action, params = {}) {
  const query = new URLSearchParams({ action, ...params });
  return API_URL + "?" + query.toString();
}

async function apiGet(action, params = {}) {
  const response = await fetch(apiUrl(action, params), { method: "GET", cache: "no-store" });
  if (!response.ok) throw new Error("Server returned HTTP " + response.status);
  const text = await response.text();
  try { return JSON.parse(text); }
  catch (error) { throw new Error("Invalid response from server."); }
}

function getSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); }
  catch (error) { return null; }
}
function setSession(username, label) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username, label }));
}
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

function showScreen(screen) {
  $("loginScreen").classList.toggle("hidden", screen !== "login");
  $("plannerScreen").classList.toggle("hidden", screen !== "planner");
}

async function boot() {
  const session = getSession();
  if (!session) { showScreen("login"); return; }
  $("plannerWho").textContent = session.label;
  showScreen("planner");
  await loadTasks();
}

$("loginBtn").addEventListener("click", login);
$("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

async function login() {
  const username = $("loginUser").value.trim();
  const password = $("loginPass").value;
  const match = Object.keys(CREDENTIALS).find(key => key.toLowerCase() === username.toLowerCase());
  const entry = match ? CREDENTIALS[match] : null;
  if (!entry || entry.password !== password) {
    $("loginError").style.display = "block";
    return;
  }
  $("loginError").style.display = "none";
  setSession(match, entry.label);
  $("loginUser").value = ""; $("loginPass").value = "";
  await boot();
}

$("plannerLogout").addEventListener("click", () => { clearSession(); location.reload(); });
$("plannerRefresh").addEventListener("click", () => loadTasks());

/* ---------------- Countdown ---------------- */

function updateCountdowns() {
  const now = new Date();
  const wedding = new Date(WEDDING_DATE);
  const finalRule = new Date(FINAL_RULE_DATE);

  const daysTo = (target) => Math.ceil((target - now) / 86400000);

  const dw = daysTo(wedding);
  $("daysToWedding").textContent = dw >= 0 ? dw : "0";

  const df = daysTo(finalRule);
  $("daysToFinalRule").textContent = df >= 0 ? df : "Overdue";
  $("finalRuleItem").classList.toggle("overdue", df < 0);
}
updateCountdowns();
setInterval(updateCountdowns, 60000);

/* ---------------- Tasks ---------------- */

let allTasks = [];

async function loadTasks() {
  try {
    const data = await apiGet("listTasks");
    allTasks = Array.isArray(data.tasks) ? data.tasks : [];
    renderSections();
  } catch (error) {
    console.error("Load tasks error:", error);
    showToast("Couldn't load the checklist.");
  }
}

function isOverdue(task) {
  if (task.done) return false;
  const now = new Date();
  if (task.deadline) {
    const d = new Date(task.deadline + "T23:59:59");
    return now > d;
  }
  if (task.isTba) return now > new Date(FINAL_RULE_DATE);
  return false;
}

function currentSectionName() {
  // Rough heuristic: which section's deadline window we're inside, based on
  // days remaining to the wedding. Purely a visual highlight, not stored data.
  const days = Math.ceil((new Date(WEDDING_DATE) - new Date()) / 86400000);
  if (days > 21) return "4 Weeks To Go";
  if (days > 14) return "3 Weeks To Go";
  if (days > 7) return "2 Weeks To Go";
  if (days > 3) return "1 Week To Go";
  if (days >= 0) return "2-3 Days / Eve";
  return "Wedding Day";
}

function renderSections() {
  const container = $("sectionsContainer");
  container.innerHTML = "";

  let totalDone = 0, totalTasks = allTasks.length;
  const current = currentSectionName();

  SECTION_ORDER.forEach(sectionName => {
    const tasks = allTasks.filter(t => t.section === sectionName);
    if (!tasks.length) return;

    const doneCount = tasks.filter(t => t.done).length;
    totalDone += doneCount;
    const pct = Math.round((doneCount / tasks.length) * 100);

    const card = document.createElement("div");
    card.className = "section-card" + (sectionName === current ? " current" : "");

    let rowsHtml = "";
    tasks.forEach(task => {
      const overdue = isOverdue(task);
      const tbaBadge = task.isTba
        ? `<span class="tba-badge${overdue ? " overdue" : ""}">${overdue ? "Overdue" : "TBA"}</span>`
        : "";
      const tbaFields = task.isTba ? `
        <div class="tba-fields">
          <input type="text" placeholder="Assigned to" value="${escapeHtml(task.assignedTo)}" data-assign-id="${escapeHtml(task.taskId)}">
          <input type="date" value="${escapeHtml(task.deadline)}" data-deadline-id="${escapeHtml(task.taskId)}">
        </div>` : "";

      rowsHtml += `
        <div class="task-row">
          <input type="checkbox" class="task-check" ${task.done ? "checked" : ""} data-task-id="${escapeHtml(task.taskId)}">
          <div class="task-body">
            <span class="task-text${task.done ? " done" : ""}">${escapeHtml(task.text)}</span>${tbaBadge}
            ${tbaFields}
          </div>
        </div>`;
    });

    card.innerHTML = `
      <div class="section-header">
        <h2>${escapeHtml(sectionName)}</h2>
        ${sectionName === current ? '<span class="section-badge">Current</span>' : ""}
      </div>
      <div class="section-progress" style="margin-bottom:6px;">${doneCount} of ${tasks.length} complete</div>
      <div class="section-bar"><div class="section-bar-fill" style="width:${pct}%"></div></div>
      ${rowsHtml}
    `;
    container.appendChild(card);
  });

  const overallPct = totalTasks ? Math.round((totalDone / totalTasks) * 100) : 0;
  $("overallFill").style.width = overallPct + "%";
  $("overallLabel").textContent = totalDone + " of " + totalTasks + " tasks complete";

  container.querySelectorAll("[data-task-id]").forEach(cb => {
    cb.addEventListener("change", () => toggleTask(cb.dataset.taskId, cb.checked));
  });
  container.querySelectorAll("[data-assign-id]").forEach(input => {
    input.addEventListener("change", () => saveTbaField(input.dataset.assignId, "assignedTo", input.value));
  });
  container.querySelectorAll("[data-deadline-id]").forEach(input => {
    input.addEventListener("change", () => saveTbaField(input.dataset.deadlineId, "deadline", input.value));
  });
}

async function toggleTask(taskId, done) {
  const task = allTasks.find(t => t.taskId === taskId);
  if (task) task.done = done; // optimistic update
  renderSections();
  try {
    const data = await apiGet("toggleTask", { id: taskId, done: done });
    if (data.status !== "success") throw new Error(data.message || "Could not update task.");
  } catch (error) {
    console.error("Toggle task error:", error);
    showToast("Couldn't save — try again.");
    await loadTasks();
  }
}

async function saveTbaField(taskId, field, value) {
  const task = allTasks.find(t => t.taskId === taskId);
  if (!task) return;
  const assignedTo = field === "assignedTo" ? value : task.assignedTo;
  const deadline = field === "deadline" ? value : task.deadline;
  try {
    const data = await apiGet("updateTask", { id: taskId, assignedTo: assignedTo, deadline: deadline });
    if (data.status !== "success") throw new Error(data.message || "Could not save.");
    task.assignedTo = assignedTo;
    task.deadline = deadline;
    showToast("Saved.");
    renderSections();
  } catch (error) {
    console.error("Update task error:", error);
    showToast("Couldn't save — try again.");
  }
}

boot();

})();
</script>

</body>
</html>
